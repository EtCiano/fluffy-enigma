<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrador de Ficha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <div id="ficha-atributos">
      <!-- Coluna esquerda: exibição dos atributos -->
      <div id="frame-atributos">
        <div id="cabecalho-ficha">
          <button onclick="app.fichaAnterior()"><</button>
          <h2 id="nome-personagem"></h2>
          <button onclick="app.proximaFicha()">></button>
          <div class="botoes-cabecalho">
            <button onclick="app.criarFicha()">+ Ficha</button>
          </div>
          <div class="botoes-cabecalho">
            <button onclick="app.abrirModalAdicionaratributo()">+ Atributo</button>
            <button onclick="app.abrirModalRemoverAtributo()">− Atributo</button>
          </div>
        </div>

        <div id="atributos-lista"></div>

        <p id="aviso-vazio">Nenhuma ficha encontrada. Crie uma ficha para começar.</p>
      </div>
    </div>

    <!-- Coluna direita: controles -->
    <div id="frame-controles">

      <div id="controles-arrays"></div>

      <!-- Alterar Atributo individual -->
      <fieldset id="frame-mudar-atributo">
        <legend>Alterar Atributo</legend>
        <select id="selecao-atributo"></select>
        <button onclick="app.abrirModalAtributo()">Mudar Atributo</button>
      </fieldset>

      <!-- Editar ficha toda -->
      <fieldset id="frame-mudar-ficha-toda">
        <legend>Ficha Completa</legend>
        <button onclick="app.abrirModalFichaCompleta()">Alterar Ficha</button>
      </fieldset>

      <!-- Reordenar atributos -->
      <fieldset id="frame-reordenar-atributos">
        <legend>Reordenar Atributos</legend>
        <button onclick="app.toggleModoReordenar()">Modo Reordenar</button>
      </fieldset>

      <!-- Deletar ficha atual-->
      <fieldset id="frame-reordenar-atributos">
        <legend class="deletar-field">Deletar ficha atual</legend>
        <button class="deletar-field" id="botao-deletar" onclick="app.deletarFicha()">DELETAR</button>
      </fieldset>

    </div>
  </div>

  <!-- Modal: alterar um atributo -->
  <div id="modal-atributo" class="modal" hidden>
    <div class="modal-conteudo">
      <h3 id="modal-atributo-titulo"></h3>
      <p id="modal-atributo-atual"></p>
      <div id="modal-atributo-inputs"></div>
      <div class="modal-botoes">
        <button onclick="app.salvarAtributo()">Salvar</button>
        <button onclick="app.fecharModal('modal-atributo')">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal: editar ficha completa -->
  <div id="modal-ficha" class="modal" hidden>
    <div class="modal-conteudo">
      <h3>Criar / Alterar Ficha</h3>
      <div id="modal-ficha-campos"></div>
      <div class="modal-botoes">
        <button onclick="app.salvarFichaCompleta()">OK</button>
        <button onclick="app.fecharModal('modal-ficha')">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal: adicionar atributo à ficha atual -->
   <div id="modal-add-atributo" class="modal" hidden>
    <div class="modal-conteudo">
      <h3>Adicionar Atributo à ficha atual</h3>
      <label for="nome-novo-atributo">Nome do Novo Atributo</label>
      <input type="text" id="nome-novo-atributo" placeholder="Nome">

      <label for="valor-novo-atributo">Valor do Novo Atributo</label>
      <input type="number" id="valor-novo-atributo" placeholder="Valor">
      <div id="container-array" style="display: none;">
        <input type="number" id="valor-novo-atributo-max" placeholder="Valor Máximo">
      </div>

      <div class="checkbox-linha">
        <label for="atributo-novo-texto">Atributo é um Texto</label>
        <input type="checkbox" id="atributo-novo-texto">
      </div>

      <div class="checkbox-linha">
        <label for="atributo-novo-array">Atributo Tem um valor total e um atual</label>
        <input type="checkbox" id="atributo-novo-array">
      </div>
      
      <div class="modal-botoes">
        <button onclick="app.adicionarAtributo()">OK</button>
        <button onclick="app.fecharModal('modal-add-atributo')">Cancelar</button>
      </div>
    </div>
   </div>

  <!-- Modal: remover atributo da ficha atual -->
   <div id="modal-remover-atributo" class="modal" hidden>
    <div class="modal-conteudo">
      <h3>Remover Atributo da ficha atual</h3>
      <label for="select-remover-atributo">Selecione o Atributo</label>
      <select id="select-remover-atributo"></select>
      
      <div class="modal-botoes">
        <button onclick="app.removerAtributo()">Remover</button>
        <button onclick="app.fecharModal('modal-remover-atributo')">Cancelar</button>
      </div>
    </div>
   </div>

  <script src="js/fichas.js"></script>
  <script>
    const checkTexto = document.getElementById('atributo-novo-texto');
    const checkArray = document.getElementById('atributo-novo-array');
    const inputValor = document.getElementById('valor-novo-atributo');
    const containerArray = document.getElementById('container-array');

    checkTexto.addEventListener('change', () => {
      if (checkTexto.checked && checkArray.checked) {
        alert('Não é possível selecionar ambos os tipos. Desmarque um deles.');
        checkTexto.checked = false;
        return;
      }
      if (checkTexto.checked) {
        inputValor.type = 'text';
        inputValor.placeholder = 'Texto';
        containerArray.style.display = 'none';
      } else {
        inputValor.type = 'number';
        inputValor.placeholder = 'Valor';
      }
    });

    checkArray.addEventListener('change', () => {
      if (checkTexto.checked && checkArray.checked) {
        alert('Não é possível selecionar ambos os tipos. Desmarque um deles.');
        checkArray.checked = false;
        return;
      }
      if (checkArray.checked) {
        inputValor.type = 'number';
        inputValor.placeholder = 'Valor Atual';
        containerArray.style.display = 'block';
      } else {
        inputValor.placeholder = 'Valor';
        containerArray.style.display = 'none';
      }
    });
  </script>
</body>
</html>
